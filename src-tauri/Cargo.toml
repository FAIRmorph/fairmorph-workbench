[package]
name = "fairmorph-workbench"
version = "0.1.0"
publish = false
description = "Offline-first desktop application for biodiversity data curation, EML 2.2.0 metadata editing, deterministic auditing, and Darwin Core / GeoPackage packaging orchestration."
authors = ["FAIRmorph Team"]
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://www.fairmorph.org"
repository = "https://github.com/fairmorph/fairmorph-workbench"
documentation = "https://github.com/fairmorph/fairmorph-workbench/blob/main/READMEx.md"
categories = [
    "science::geo",
    "science",
    "gui",
    "parsing",
]
keywords = ["biodiversity-data","data-curation","darwin-core","eml-metadata","geopackage","fair-data"]

[lib]
name = "fairmorph_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
