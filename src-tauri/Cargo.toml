[package]
name = "fairmorph-workbench"
version = "0.1.0"
publish = false
description = "Local-first Svelte/Tauri desktop UI for FAIRmorph Engine project setup, technical pipelines, RUN verification, and dataset-title revisions (v0.13 proof of concept)."
authors = ["FAIRmorph Team"]
edition = "2021"
license = "MIT"
readme = "README.md"
homepage = "https://www.fairmorph.org"
repository = "https://github.com/fairmorph/fairmorph-workbench"
documentation = "https://github.com/FAIRmorph/fairmorph-workbench/blob/main/docs/USER-GUIDE.md"
categories = [
    "science::geo",
    "science",
    "gui",
    "parsing",
]
keywords = ["biodiversity-data","data-curation","darwin-core","eml-metadata","geopackage","fair-data"]

[lib]
name = "fairmorph_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
