name: PoC project setup CLI integration

on:
  pull_request:
    paths:
      - 'src-tauri/src/engine.rs'
      - 'src-tauri/src/lib.rs'
      - 'src/lib/project-setup*'
      - 'src/lib/engine-protocol*'
      - 'src/routes/+page.svelte'
      - 'scripts/test-project-setup.mjs'
      - '.github/workflows/project-setup-integration.yml'
  workflow_dispatch:

jobs:
  project-setup-integration:
    name: Engine setup integration (synthetic data, no RUN)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workbench
        uses: actions/checkout@v4
        with:
          path: workbench
      - name: Checkout compatible FAIRmorph Engine v0.13
        uses: actions/checkout@v4
        with:
          repository: FAIRmorph/fairmorph-engine
          ref: c84b6f87585bab1237d6383cd3a47311f57250c2
          path: engine
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Engine and contracts
        run: python -m pip install -e ./engine
      - name: Exercise real Engine CLI against synthetic source files
        working-directory: workbench
        env:
          FAIRMORPH_ENGINE_PYTHON: python
        run: node scripts/test-project-setup.mjs
