name: Workbench PoC CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: PR checks (Linux)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout workbench
        uses: actions/checkout@v4
      - name: Checkout engine for PoC integration
        uses: actions/checkout@v4
        with:
          repository: FAIRmorph/fairmorph-engine
          ref: main
          path: fairmorph-engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install and cache Linux Tauri test dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0
      - name: Install engine for integration tests
        run: python -m pip install -e ./fairmorph-engine
      - name: Configure Python for Rust integration test
        run: python -c "import os,sys;open(os.environ['GITHUB_ENV'],'a').write('FAIRMORPH_ENGINE_PYTHON='+sys.executable+'\n')"
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend checks
        run: |
          pnpm check
          pnpm test:frontend
      - name: Rust tests (including engine subprocess)
        run: pnpm test:rust
