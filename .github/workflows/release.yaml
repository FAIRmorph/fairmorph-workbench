name: Build and Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-name: linux-packages
            bundle-path: |
              fairmorph-workbench/src-tauri/target/release/bundle/appimage/*.AppImage
              fairmorph-workbench/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: windows-packages
            bundle-path: |
              fairmorph-workbench/src-tauri/target/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Workbench
        uses: actions/checkout@v4
        with:
          path: fairmorph-workbench

      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          repository: fairmorph/fairmorph-engine
          path: fairmorph-engine
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: fairmorph-workbench/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Engine & Run Tests
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pyinstaller-hooks-contrib pytest
          pip install -e ./fairmorph-engine
          pytest ./fairmorph-engine/tests

      - name: Configure Python for Rust integration test
        run: python -c "import os,sys;open(os.environ['GITHUB_ENV'],'a').write('FAIRMORPH_ENGINE_PYTHON='+sys.executable+'\\n')"

      - name: Install Node Dependencies & Typecheck
        working-directory: fairmorph-workbench
        run: |
          pnpm install --frozen-lockfile
          pnpm check

      - name: Bundle Engine (PyInstaller)
        working-directory: fairmorph-workbench
        run: python scripts/bundle_engine.py

      - name: Smoke-test bundled engine
        working-directory: fairmorph-workbench
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="src-tauri/engine/fairmorph-engine.exe"
          else
            bin="src-tauri/engine/fairmorph-engine"
          fi
          "$bin" poc --records 2 > engine-smoke.ndjson
          python -c "import json; assert any(json.loads(line).get('event') == 'result' for line in open('engine-smoke.ndjson'))"

      - name: Build Tauri Desktop App
        working-directory: fairmorph-workbench
        run: pnpm tauri build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error

  attach-to-release:
    name: Attach Artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Upload Assets to Existing GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            release-assets/linux-packages/*
            release-assets/windows-packages/*

  trigger-documentation:
    name: Trigger Documentation Rebuild
    needs: [attach-to-release]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Short-Lived App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: fairmorph
          repositories: fairmorph.org

      - name: Dispatch Docs Rebuild Event
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/fairmorph/fairmorph.org/dispatches \
            -d '{"event_type": "docs-update"}'