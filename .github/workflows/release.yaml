name: Build and Publish Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            artifact-name: linux-packages
            bundle-path: |
              fairmorph-workbench/src-tauri/target/release/bundle/appimage/*.AppImage
              fairmorph-workbench/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact-name: windows-packages
            bundle-path: |
              fairmorph-workbench/src-tauri/target/release/bundle/nsis/*.exe
              fairmorph-workbench/src-tauri/target/release/bundle/portable/*.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Workbench
        uses: actions/checkout@v4
        with:
          path: fairmorph-workbench

      - name: Checkout Engine
        uses: actions/checkout@v4
        with:
          repository: fairmorph/fairmorph-engine
          path: fairmorph-engine
          # Pinned Engine revision from the verified v0.1.0 release build.
          ref: a534d8c8e573b188e8a359c297a31f03f7bcc46a

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: fairmorph-workbench/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fairmorph-workbench/src-tauri -> target
          prefix-key: release
      - name: Install and cache Linux build dependencies
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0

      - name: Install Engine and packaging tools
        run: |
          python -m pip install pyinstaller pyinstaller-hooks-contrib
          python -m pip install -e ./fairmorph-engine

      - name: Run Engine Python tests (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install pytest
          python -m pytest ./fairmorph-engine/tests

      - name: Install Node dependencies
        working-directory: fairmorph-workbench
        run: pnpm install --frozen-lockfile

      - name: Bundle Engine (PyInstaller)
        working-directory: fairmorph-workbench
        run: python scripts/bundle_engine.py

      - name: Smoke-test bundled engine
        working-directory: fairmorph-workbench
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            bin="src-tauri/engine/fairmorph-engine.exe"
          else
            bin="src-tauri/engine/fairmorph-engine"
          fi
          "$bin" poc --records 2 > engine-smoke.ndjson
          python -c "import json; assert any(json.loads(line).get('event') == 'result' for line in open('engine-smoke.ndjson'))"

      - name: Build Tauri Desktop App
        working-directory: fairmorph-workbench
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Package portable Windows ZIP
        if: runner.os == 'Windows'
        working-directory: fairmorph-workbench
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $staging = Join-Path $env:RUNNER_TEMP 'FAIRmorph-Workbench-portable'
          $output = 'src-tauri/target/release/bundle/portable'
          New-Item -ItemType Directory -Force -Path $staging, $output | Out-Null
          Copy-Item 'src-tauri/target/release/fairmorph-workbench.exe' $staging
          Copy-Item 'src-tauri/engine' $staging -Recurse
          $zip = Join-Path $output 'FAIRmorph-Workbench-windows-portable.zip'
          Compress-Archive -Path (Join-Path $staging '*') -DestinationPath $zip -Force
          $verify = Join-Path $env:RUNNER_TEMP 'fairmorph-portable-verify'
          Expand-Archive -Path $zip -DestinationPath $verify -Force
          if (-not (Test-Path (Join-Path $verify 'fairmorph-workbench.exe'))) { throw 'Workbench executable missing from portable ZIP' }
          $engine = Join-Path $verify 'engine/fairmorph-engine.exe'
          if (-not (Test-Path $engine)) { throw 'Engine executable missing from portable ZIP' }
          & $engine poc --records 2 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Portable engine smoke test failed' }

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error

  attach-to-release:
    name: Attach Artifacts to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      # upload-artifact preserves paths relative to the common bundle directory
      # (e.g. linux-packages/deb/*.deb). Flatten only the four expected release files.
      - name: Verify and stage release packages
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/publish
          for spec in \
            'linux-packages|*.deb' \
            'linux-packages|*.AppImage' \
            'windows-packages|*.exe' \
            'windows-packages|*.zip'; do
            source_dir="release-assets/${spec%%|*}"
            pattern="${spec#*|}"
            if [ ! -d "$source_dir" ]; then
              echo "::error::Missing artifact directory: $source_dir"
              exit 1
            fi
            mapfile -d '' matches < <(find "$source_dir" -type f -name "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $pattern in $source_dir, found ${#matches[@]}"
              exit 1
            fi
            cp -- "${matches[0]}" release-assets/publish/
          done
          ls -lh release-assets/publish/

      - name: Upload Assets to Existing GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          fail_on_unmatched_files: true
          files: |
            release-assets/publish/*

  trigger-documentation:
    name: Trigger Documentation Rebuild
    needs: [attach-to-release]
    runs-on: ubuntu-latest
    steps:
      - name: Generate Short-Lived App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.DOCS_APP_ID }}
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          owner: fairmorph
          repositories: fairmorph.org

      - name: Dispatch Docs Rebuild Event
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            https://api.github.com/repos/fairmorph/fairmorph.org/dispatches \
            -d '{"event_type": "code-updated"}'